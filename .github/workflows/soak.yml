# Every night: the runner for 45 minutes on a recording played back (tools/soak.py) - does anything keep growing?
name: Soak

on:
  schedule:
    - cron: "30 18 * * *"          # 02:30 in Taiwan
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long (minutes)"
        default: "45"

permissions:
  contents: read

jobs:
  soak:
    name: Soak (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web interface
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: "System libraries (OpenCV)"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: "Install (the runtime edition)"
        run: pip install -r requirements-runtime.txt
      - name: "The runner for a while"
        shell: bash
        run: python -m tools.soak --minutes "${{ github.event.inputs.minutes || '45' }}" --out soak.json 2>&1 | tee soak.log
      - name: "The report on the run's page"
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          def error(text):                  # an annotation: anyone can read it, without signing in
              print("::error title=soak::" + text.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          if not os.path.exists("soak.json"):
              log = open("soak.log", errors="replace").read()[-3000:] if os.path.exists("soak.log") else "(no output)"
              error("no report; the end of its output:\n" + log)
              raise SystemExit
          r = json.load(open("soak.json"))["report"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Soak\n\n" + chr(96) * 3 + "\n" + json.dumps(r, indent=1) + "\n" + chr(96) * 3 + "\n")
          for p in r["problems"]:
              error(p)
          PY
