# On every push and pull request: the tests (Windows and Linux), the web interface's type check and build, and the pages in a browser.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: "System libraries (OpenCV, a font for the digit tests)"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 fonts-dejavu-core
      - name: "Install (the runtime edition: no PyTorch)"
        run: pip install -r requirements-runtime.txt pytest httpx
      - name: Tests
        run: python -m pytest -q

  web:
    name: Web interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check and build
        run: npm run build

  pages:
    name: Pages in a browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web interface
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: "System libraries (OpenCV)"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install (the runtime edition, a browser)
        run: |
          pip install -r requirements-runtime.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: "From an empty project through every page"
        run: python -m pytest e2e -q
